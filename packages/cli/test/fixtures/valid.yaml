$id: https://example.com/fixture-cli/0.1
specVersion: '0.1'
cli:
  name: fixture
  description: A fixture CLI.
  commandSeparator: ':'
  endOfOptions: true
commands:
  - id: hello
    invocation: [hello]
    flags:
      - id: json
        long: json
        description: Produce JSON output.
        kind: boolean
        valueSchema:
          type: boolean
    exitCodes:
      - id: success
        code: 0
        description: The command succeeded.
